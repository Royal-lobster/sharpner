<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f0d0a" />
    <meta name="color-scheme" content="dark" />
    <title>Sharpner</title>
    <meta name="description" content="A shared infinite canvas where people and AI agents design product UI together, grounded in your design system." />
    <script>
      // Start public sign-in configuration while the application bundle downloads.
      if (!/^\/s\//.test(location.pathname)) {
        window.__sharpnerAuthConfig = fetch("/auth/config").then((response) => {
          if (!response.ok) throw new Error("Sign-in could not be loaded.");
          return response.json();
        }).then((config) => {
          if (config.configured && config.publishableKey && (!config.appOrigin || config.appOrigin === location.origin)) {
            try {
              const host = atob(config.publishableKey.replace(/^pk_(test|live)_/, "")).replace(/\$$/, "");
              if (/^[a-z0-9.-]+$/i.test(host) && host.includes(".")) {
                for (const path of ["clerk-js@6/dist/clerk.browser.js", "ui@1/dist/ui.browser.js"]) {
                  const link = document.createElement("link");
                  link.rel = "preload"; link.as = "script"; link.crossOrigin = "anonymous";
                  link.href = "https://" + host + "/npm/@clerk/" + path;
                  document.head.append(link);
                }
              }
            } catch {}
          }
          return config;
        });
        window.__sharpnerAuthConfig.catch(() => {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
